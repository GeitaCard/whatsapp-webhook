<!DOCTYPE html>
<html lang="sw">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>GeitaCard - Wahudhuriaji</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f4f6f8;
      color: #222;
    }

    header {
      background: #111827;
      color: white;
      padding: 20px;
    }

    header h1 {
      font-size: 24px;
    }

    header p {
      margin-top: 5px;
      opacity: 0.8;
    }

    .container {
      max-width: 1200px;
      margin: auto;
      padding: 20px;
    }

    .stats {
      display: grid;
      grid-template-columns:
        repeat(auto-fit, minmax(180px, 1fr));

      gap: 15px;
      margin-bottom: 20px;
    }

    .card {
      background: white;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }

    .card h3 {
      font-size: 15px;
      color: #666;
      margin-bottom: 10px;
    }

    .number {
      font-size: 30px;
      font-weight: bold;
    }

    .controls {
      background: white;
      padding: 15px;
      border-radius: 12px;
      margin-bottom: 20px;

      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    input,
    select,
    button {
      padding: 12px;
      border-radius: 8px;
      border: 1px solid #ddd;
      font-size: 15px;
    }

    input {
      flex: 1;
      min-width: 220px;
    }

    button {
      background: #111827;
      color: white;
      cursor: pointer;
      border: none;
    }

    button:hover {
      opacity: 0.9;
    }

    .table-container {
      background: white;
      border-radius: 12px;
      overflow-x: auto;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }

    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 800px;
    }

    th,
    td {
      padding: 14px;
      text-align: left;
      border-bottom: 1px solid #eee;
    }

    th {
      background: #f9fafb;
    }

    .status {
      padding: 6px 10px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: bold;
      display: inline-block;
    }

    .confirmed {
      background: #dcfce7;
      color: #166534;
    }

    .declined {
      background: #fee2e2;
      color: #991b1b;
    }

    .maybe {
      background: #fef3c7;
      color: #92400e;
    }

    .pending {
      background: #e5e7eb;
      color: #374151;
    }

    .loading {
      text-align: center;
      padding: 30px;
    }

    .error {
      color: #b91c1c;
      padding: 20px;
      text-align: center;
    }

    @media (max-width: 600px) {
      .container {
        padding: 12px;
      }

      header {
        padding: 15px;
      }

      header h1 {
        font-size: 20px;
      }

      .card {
        padding: 15px;
      }
    }
  </style>
</head>

<body>

<header>
  <h1>GeitaCard</h1>
  <p>Dashboard ya Wahudhuriaji</p>
</header>

<div class="container">

  <div class="stats">

    <div class="card">
      <h3>Jumla ya Wageni</h3>
      <div class="number" id="total">0</div>
    </div>

    <div class="card">
      <h3>Watashiriki</h3>
      <div class="number" id="confirmed">0</div>
    </div>

    <div class="card">
      <h3>Hawashiriki</h3>
      <div class="number" id="declined">0</div>
    </div>

    <div class="card">
      <h3>Sina Uhakika</h3>
      <div class="number" id="maybe">0</div>
    </div>

    <div class="card">
      <h3>Bado Hawajajibu</h3>
      <div class="number" id="pending">0</div>
    </div>

  </div>


  <div class="controls">

    <input
      type="text"
      id="search"
      placeholder="Tafuta jina, simu au code..."
    >

    <select id="statusFilter">

      <option value="all">
        Hali zote
      </option>

      <option value="confirmed">
        Nitashiriki
      </option>

      <option value="declined">
        Sitashiriki
      </option>

      <option value="maybe">
        Sina uhakika
      </option>

      <option value="pending">
        Pending
      </option>

    </select>

    <button onclick="loadGuests()">
      🔄 Refresh
    </button>

  </div>


  <div class="table-container">

    <div id="loading" class="loading">
      Inapakia wageni...
    </div>

    <div id="error" class="error"></div>

    <table id="guestTable" style="display:none">

      <thead>

        <tr>
          <th>#</th>
          <th>Jina</th>
          <th>Simu</th>
          <th>Code</th>
          <th>Aina</th>
          <th>Ushiriki</th>
          <th>Check-in</th>
        </tr>

      </thead>

      <tbody id="guestBody"></tbody>

    </table>

  </div>

</div>


<script>

  let guests = [];


  async function loadGuests() {

    const loading =
      document.getElementById("loading");

    const error =
      document.getElementById("error");

    const table =
      document.getElementById("guestTable");

    loading.style.display = "block";

    error.innerText = "";

    table.style.display = "none";


    try {

      const response =
        await fetch("/api/attendance");

      const result =
        await response.json();


      if (!result.success) {

        throw new Error(
          result.error || "Imeshindikana kupakia data"
        );

      }


      guests = result.guests || [];


      updateStats();

      renderGuests();


      loading.style.display = "none";

      table.style.display = "table";


    } catch (err) {

      loading.style.display = "none";

      error.innerText =
        "❌ Imeshindikana kupakia wageni: "
        + err.message;

    }

  }


  function updateStats() {

    document.getElementById("total").innerText =
      guests.length;

    document.getElementById("confirmed").innerText =
      guests.filter(
        g => g.attendance_status === "confirmed"
      ).length;

    document.getElementById("declined").innerText =
      guests.filter(
        g => g.attendance_status === "declined"
      ).length;

    document.getElementById("maybe").innerText =
      guests.filter(
        g => g.attendance_status === "maybe"
      ).length;

    document.getElementById("pending").innerText =
      guests.filter(
        g => g.attendance_status === "pending"
      ).length;

  }


  function renderGuests() {

    const search =
      document
        .getElementById("search")
        .value
        .toLowerCase()
        .trim();


    const filter =
      document.getElementById("statusFilter")
        .value;


    const filtered =
      guests.filter(guest => {

        const text =
          (
            guest.full_name || ""
          ).toLowerCase()
          + " "
          + (
            guest.phone || ""
          ).toLowerCase()
          + " "
          + (
            guest.guest_code || ""
          ).toLowerCase();


        const matchesSearch =
          text.includes(search);


        const matchesStatus =
          filter === "all"
          || guest.attendance_status === filter;


        return (
          matchesSearch
          && matchesStatus
        );

      });


    const body =
      document.getElementById("guestBody");

    body.innerHTML = "";


    filtered.forEach(
      (guest, index) => {

        const row =
          document.createElement("tr");


        row.innerHTML = `

          <td>${index + 1}</td>

          <td>
            ${guest.full_name || "-"}
          </td>

          <td>
            ${guest.phone || "-"}
          </td>

          <td>
            ${guest.guest_code || "-"}
          </td>

          <td>
            ${guest.invitation_type || "-"}
          </td>

          <td>
            ${statusLabel(
              guest.attendance_status
            )}
          </td>

          <td>
            ${
              guest.scanned_at
                ? "✅ Checked-in"
                : "—"
            }
          </td>

        `;


        body.appendChild(row);

      }
    );

  }


  function statusLabel(status) {

    if (status === "confirmed") {

      return `
        <span class="status confirmed">
          Nitashiriki
        </span>
      `;

    }


    if (status === "declined") {

      return `
        <span class="status declined">
          Sitashiriki
        </span>
      `;

    }


    if (status === "maybe") {

      return `
        <span class="status maybe">
          Sina uhakika
        </span>
      `;

    }


    return `
      <span class="status pending">
        Pending
      </span>
    `;

  }


  document
    .getElementById("search")
    .addEventListener(
      "input",
      renderGuests
    );


  document
    .getElementById("statusFilter")
    .addEventListener(
      "change",
      renderGuests
    );


  loadGuests();

</script>

</body>
</html>
