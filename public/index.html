<!DOCTYPE html>
<html lang="sw">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>GeitaCard - Dashboard</title>

  <style>

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f4f6f8;
      color: #222;
    }

    header {
      background: #111827;
      color: white;
      padding: 20px;
    }

    header h1 {
      font-size: 24px;
    }

    header p {
      margin-top: 5px;
      opacity: 0.8;
    }

    .container {
      max-width: 1200px;
      margin: auto;
      padding: 20px;
    }

    /* ==============================
       STATISTICS
    ============================== */

    .stats {
      display: grid;
      grid-template-columns:
        repeat(auto-fit, minmax(170px, 1fr));

      gap: 15px;
      margin-bottom: 20px;
    }

    .card {
      background: white;
      padding: 20px;
      border-radius: 12px;

      box-shadow:
        0 2px 8px rgba(0,0,0,0.08);
    }

    .card h3 {
      font-size: 14px;
      color: #666;
      margin-bottom: 10px;
    }

    .number {
      font-size: 30px;
      font-weight: bold;
    }

    /* ==============================
       CHECK-IN
    ============================== */

    .checkin-box {
      background: white;
      padding: 20px;
      border-radius: 12px;
      margin-bottom: 20px;

      box-shadow:
        0 2px 8px rgba(0,0,0,0.08);
    }

    .checkin-box h2 {
      margin-bottom: 8px;
      font-size: 20px;
    }

    .checkin-box p {
      color: #666;
      margin-bottom: 15px;
    }

    .checkin-form {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .checkin-form input {
      flex: 1;
      min-width: 220px;

      padding: 14px;

      border: 1px solid #ddd;
      border-radius: 8px;

      font-size: 16px;
    }

    .checkin-button {
      background: #111827;
      color: white;

      border: none;
      border-radius: 8px;

      padding: 14px 22px;

      font-size: 16px;
      font-weight: bold;

      cursor: pointer;
    }

    .checkin-button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    #checkinMessage {
      margin-top: 15px;
      font-weight: bold;
    }

    .success-message {
      color: #166534;
      background: #dcfce7;

      padding: 12px;
      border-radius: 8px;
    }

    .error-message {
      color: #991b1b;
      background: #fee2e2;

      padding: 12px;
      border-radius: 8px;
    }

    .warning-message {
      color: #92400e;
      background: #fef3c7;

      padding: 12px;
      border-radius: 8px;
    }

    /* ==============================
       CONTROLS
    ============================== */

    .controls {
      background: white;

      padding: 15px;

      border-radius: 12px;

      margin-bottom: 20px;

      display: flex;

      gap: 10px;

      flex-wrap: wrap;
    }

    .controls input,
    .controls select,
    .controls button {

      padding: 12px;

      border-radius: 8px;

      border: 1px solid #ddd;

      font-size: 15px;
    }

    .controls input {

      flex: 1;

      min-width: 220px;
    }

    .controls button {

      background: #111827;

      color: white;

      border: none;

      cursor: pointer;

      font-weight: bold;
    }

    .controls button:hover {
      opacity: 0.9;
    }

    /* ==============================
       TABLE
    ============================== */

    .table-container {

      background: white;

      border-radius: 12px;

      overflow-x: auto;

      box-shadow:
        0 2px 8px rgba(0,0,0,0.08);
    }

    table {

      width: 100%;

      border-collapse: collapse;

      min-width: 850px;
    }

    th,
    td {

      padding: 14px;

      text-align: left;

      border-bottom: 1px solid #eee;
    }

    th {

      background: #f9fafb;
    }

    .status {

      padding: 6px 10px;

      border-radius: 20px;

      font-size: 13px;

      font-weight: bold;

      display: inline-block;
    }

    .confirmed {

      background: #dcfce7;

      color: #166534;
    }

    .declined {

      background: #fee2e2;

      color: #991b1b;
    }

    .maybe {

      background: #fef3c7;

      color: #92400e;
    }

    .pending {

      background: #e5e7eb;

      color: #374151;
    }

    .checked {

      background: #dbeafe;

      color: #1e40af;
    }

    .not-checked {

      color: #777;
    }

    .loading {

      text-align: center;

      padding: 30px;
    }

    .error {

      color: #b91c1c;

      padding: 20px;

      text-align: center;
    }

    @media (max-width: 600px) {

      .container {
        padding: 12px;
      }

      header {
        padding: 15px;
      }

      header h1 {
        font-size: 20px;
      }

      .card {
        padding: 15px;
      }

      .controls button {
        width: 100%;
      }

    }

  </style>

</head>


<body>


<header>

  <h1>GeitaCard</h1>

  <p>
    Dashboard ya Wahudhuriaji
  </p>

</header>


<div class="container">


  <!-- ==============================
       STATISTICS
  =============================== -->

  <div class="stats">


    <div class="card">

      <h3>
        Jumla ya Wageni
      </h3>

      <div
        class="number"
        id="total"
      >
        0
      </div>

    </div>


    <div class="card">

      <h3>
        Watashiriki
      </h3>

      <div
        class="number"
        id="confirmed"
      >
        0
      </div>

    </div>


    <div class="card">

      <h3>
        Hawashiriki
      </h3>

      <div
        class="number"
        id="declined"
      >
        0
      </div>

    </div>


    <div class="card">

      <h3>
        Sina Uhakika
      </h3>

      <div
        class="number"
        id="maybe"
      >
        0
      </div>

    </div>


    <div class="card">

      <h3>
        Bado Hawajajibu
      </h3>

      <div
        class="number"
        id="pending"
      >
        0
      </div>

    </div>


    <div class="card">

      <h3>
        Wameingia Ukumbini
      </h3>

      <div
        class="number"
        id="checkedIn"
      >
        0
      </div>

    </div>
